name: Build with Nuitka

on:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Nuitka
          pip install -r requirements.txt

      - name: Build
        run: |
          python -m nuitka --standalone --windows-console-mode=disable --windows-icon-from-ico=logo.ico --jobs=2 --assume-yes-for-downloads --enable-plugin=pyqt6 lims_duty.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 施工登录
          path: lims_duty.dist/
